services:
  fitness-web-dev:
    profiles:
      - dev
    user: "${CURRENT_UID:-1000}:${CURRENT_GID:-1000}"
    build:
      context: .
      target: development
      args:
        - APP_URL=${APP_URL}
        - APP_PORT=${APP_PORT}
        - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
    container_name: fitness-web
    restart: unless-stopped
    volumes:
      - .:/app
    networks:
      - caddy_network
    labels:
      caddy: ${APP_URL}
      caddy.handle: /*
      caddy.handle.reverse_proxy: "{{upstreams 5173}}"
      caddy.handle.import: caddy_headers
      caddy.handle.header.Content-Security-Policy: "\"default-src 'self'; object-src 'none'; script-src 'self' 'sha256-Akx81LTsWCVp3iWyXyi3SW8iXk3ZlexgsW2zMsIiND8=' https://www.google.com/recaptcha/ https://www.gstatic.com/recaptcha/ https://accounts.google.com/gsi/client; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; frame-src 'self' https://www.google.com/recaptcha/ https://recaptcha.google.com/recaptcha/ https://accounts.google.com/gsi/; connect-src 'self' ws: wss: https://accounts.google.com/gsi/ https://generativelanguage.googleapis.com https://www.google.com/recaptcha/; img-src 'self' data: https:; font-src 'self' data: https://fonts.gstatic.com; frame-ancestors 'self'; upgrade-insecure-requests;\""


  fitness-web-prod:
    profiles:
      - prod
    build:
      context: .
      target: production
      args:
        - APP_URL=${APP_URL}
        - APP_PORT=${APP_PORT}
        - RECAPTCHA_SITE_KEY=${RECAPTCHA_SITE_KEY}
    container_name: fitness-web
    restart: unless-stopped
    networks:
      - caddy_network
    labels:
      caddy: ${APP_URL}
      caddy.handle: /*
      caddy.handle.reverse_proxy: "{{upstreams 80}}"
      caddy.handle.import: caddy_headers

networks:
  caddy_network:
    external: true